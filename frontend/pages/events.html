<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Events</title>
  <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <h1>All Events</h1>

      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;">
      <input type="text" id="search-box" placeholder="Search events, e.g. AI Workshop" style="flex:2; min-width:200px;">
      <select id="category-filter" style="flex:1; min-width:150px;">
        <option value="">All Categories</option>
        <option>Seminar</option>
        <option>Workshop</option>
        <option>Sports</option>
        <option>Competition</option>
        <option>Conference</option>
        <option>Society</option>
      </select>
      <button id="search-btn" class="btn">Search</button>
      <button id="clear-btn" class="btn btn-outline" style="color:#2563eb;">Clear</button>
    </div>

    <div id="event-list" class="event-grid"></div>
  </main>

  <div id="footer"></div>

  <script src="/src/js/api.js"></script>
  <script src="/components/navbar.js"></script>
  <script src="/components/footer.js"></script>
  <script src="/components/eventCard.js"></script>
  <script src="/src/js/events.js"></script>
</body>
</html>
